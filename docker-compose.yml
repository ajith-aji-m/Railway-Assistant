services:
  app:
    build:
      context: .
      args:
        VITE_APP_NAME: "Railway Assistant"
    image: railway-assistant:latest
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    env_file:
      - .env.production
    environment:
      # Container-specific values; everything else comes from .env.production.
      APP_ENV: production
      LOG_CHANNEL: stderr
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/storage/database/database.sqlite
    volumes:
      - storage:/var/www/html/storage

volumes:
  storage:
